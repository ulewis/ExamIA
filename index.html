<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamIA UPCH</title><style>body{font:16px system-ui;background:#f3f6fa;color:#17324a;margin:0}header{background:#123757;color:white;padding:20px}main{max-width:900px;margin:25px auto;padding:16px}.card{background:white;border:1px solid #dbe4ed;border-radius:14px;padding:22px;margin:14px 0}button{background:#1267ae;color:white;border:0;border-radius:8px;padding:10px 16px;margin:5px;cursor:pointer}input,select,textarea{padding:9px;border:1px solid #b7c7d7;border-radius:6px;margin:7px 0;max-width:100%;box-sizing:border-box}input:not([type=checkbox]):not([type=radio]),textarea{width:100%}label{display:block;margin:10px 0}.warning{background:#fff0d7;padding:14px;border-radius:8px}video{max-width:320px;width:100%;background:#111}.hidden{display:none}</style><header><b>🛡 ExamIA UPCH</b> · Prototipo</header><main><p class="warning">Demostración local: los roles son simulados, no hay autenticación UPCH real, ni almacenamiento compartido ni análisis de IA. No utilizar para exámenes oficiales.</p><section id="login" class="card"><h2>Acceso de demostración</h2><label>Rol<select id="role"><option>docente</option><option>estudiante</option><option>administrador</option></select></label><label>Correo UPCH<input id="email" value="demo@upch.pe"></label><button onclick="enter()">Entrar</button></section><section id="app" class="hidden"><nav><button onclick="home()">Exámenes</button><button onclick="results()">Resultados</button><button onclick="logout()">Salir</button></nav><h2 id="heading"></h2><div id="view"></div></section></main><script>
const KEY='examia-demo-v1',demo={id:'demo',title:'Evaluación de ejemplo',course:'Proyecto Integrador',minutes:15,camera:false,tabs:true,published:true,questions:[{id:'q1',type:'choice',text:'¿Qué protocolo se utiliza en IoT?',options:['FTP','MQTT','SMTP','POP3'],correct:1,points:5},{id:'q2',type:'text',text:'Explica una ventaja del diseño modular.',points:5}]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||{exams:[demo],attempts:[]},role='',email='',exam=null,answers={},events=[],stream=null,timer=null,start=0;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function enter(){email=$('email').value.trim().toLowerCase();if(!/^[^@\s]+@upch\.pe$/.test(email))return alert('Ingrese correo @upch.pe');role=$('role').value;$('login').classList.add('hidden');$('app').classList.remove('hidden');home()}function stop(){clearInterval(timer);document.removeEventListener('visibilitychange',visibility);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function logout(){stop();$('app').classList.add('hidden');$('login').classList.remove('hidden')}function home(){stop();$('heading').textContent='Exámenes';$('view').innerHTML=(role==='estudiante'?'':'<button onclick="create()">Crear examen</button>')+db.exams.filter(e=>role!=='estudiante'||e.published).map(e=>'<div class="card"><h3>'+esc(e.title)+'</h3><p>'+esc(e.course)+' · '+e.minutes+' minutos · '+e.questions.length+' preguntas</p><p>Cámara: '+(e.camera?'obligatoria':'opcional')+' · '+(e.published?'Publicado':'Borrador')+'</p><button onclick="prepare(\''+e.id+'\')">Rendir / vista previa</button>'+(role==='estudiante'?'':'<button onclick="edit(\''+e.id+'\')">Editar</button>')+'</div>').join('')}function create(){exam={id:uid(),title:'Nuevo examen',course:'',minutes:30,camera:true,tabs:true,published:false,questions:[]};editor()}function edit(id){exam=structuredClone(db.exams.find(e=>e.id===id));editor()}function addQ(){exam.questions.push({id:uid(),type:'choice',text:'',options:['','','',''],correct:0,points:1});editor()}function typeQ(i,t){let q=exam.questions[i];q.type=t;q.options=t==='text'?[]:t==='boolean'?['Verdadero','Falso']:['','','',''];q.correct=0;editor()}function editor(){$('heading').textContent='Editor';$('view').innerHTML='<div class="card"><label>Título<input value="'+esc(exam.title)+'" oninput="exam.title=this.value"></label><label>Curso<input value="'+esc(exam.course)+'" oninput="exam.course=this.value"></label><label>Duración<input type="number" min="1" value="'+exam.minutes+'" oninput="exam.minutes=+this.value"></label><label><input type="checkbox" '+(exam.camera?'checked':'')+' onchange="exam.camera=this.checked"> Cámara obligatoria</label><label><input type="checkbox" '+(exam.tabs?'checked':'')+' onchange="exam.tabs=this.checked"> Registrar cambios de pestaña</label><label><input type="checkbox" '+(exam.published?'checked':'')+' onchange="exam.published=this.checked"> Publicar</label></div>'+exam.questions.map((q,i)=>'<div class="card"><b>Pregunta '+(i+1)+'</b><button onclick="exam.questions.splice('+i+',1);editor()">Eliminar</button><label>Enunciado<textarea oninput="exam.questions['+i+'].text=this.value">'+esc(q.text)+'</textarea></label><label>Tipo<select onchange="typeQ('+i+',this.value)">'+[['choice','Opción múltiple'],['boolean','Verdadero/Falso'],['text','Desarrollo']].map(([v,n])=>'<option value="'+v+'" '+(q.type===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Puntos<input type="number" min="0" value="'+q.points+'" oninput="exam.questions['+i+'].points=+this.value"></label>'+(q.type==='text'?'':q.options.map((o,j)=>'<label><input type="radio" name="correct'+i+'" '+(q.correct===j?'checked':'')+' onchange="exam.questions['+i+'].correct='+j+'"> Alternativa '+(j+1)+'<input value="'+esc(o)+'" '+(q.type==='boolean'?'disabled':'')+' oninput="exam.questions['+i+'].options['+j+']=this.value"></label>').join(''))+'</div>').join('')+'<button onclick="addQ()">Añadir pregunta</button><button onclick="saveExam()">Guardar examen</button>'}function saveExam(){if(!exam.title.trim()||exam.minutes<1)return alert('Revise título y duración');db.exams=db.exams.filter(e=>e.id!==exam.id);db.exams.push(exam);save();home()}async function prepare(id){exam=db.exams.find(e=>e.id===id);$('heading').textContent='Preparación';$('view').innerHTML='<div class="card"><h3>'+esc(exam.title)+'</h3><p>Cámara '+(exam.camera?'obligatoria':'opcional')+'</p>'+(exam.camera?'<video id="preview" autoplay muted playsinline></video><p id="camstatus">Solicitando cámara…</p>':'')+'<button id="startbtn" '+(exam.camera?'disabled':'')+' onclick="begin()">Iniciar</button></div>';if(exam.camera)try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('preview').srcObject=stream;$('camstatus').textContent='Cámara disponible';$('startbtn').disabled=false}catch(e){$('camstatus').textContent='Error de cámara: '+e.name}}function visibility(){if(document.hidden&&exam.tabs)events.push({event:'Cambio de pestaña',time:new Date().toISOString()})}function begin(){answers={};events=[];start=Date.now();document.addEventListener('visibilitychange',visibility);$('heading').textContent=exam.title;$('view').innerHTML='<h3 id="clock"></h3>'+exam.questions.map((q,i)=>'<div class="card"><h3>'+(i+1)+'. '+esc(q.text)+' ('+q.points+' pt)</h3>'+(q.type==='text'?'<textarea oninput="answers[\''+q.id+'\']=this.value"></textarea>':q.options.map((o,j)=>'<label><input type="radio" name="'+q.id+'" onchange="answers[\''+q.id+'\']='+j+'">'+esc(o)+'</label>').join(''))+'</div>').join('')+'<button onclick="submitExam()">Entregar</button>';timer=setInterval(()=>{let s=Math.max(0,exam.minutes*60-Math.floor((Date.now()-start)/1000));if($('clock'))$('clock').textContent='Tiempo restante: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s===0)submitExam(true)},1000)}function submitExam(auto=false){if(!auto&&!confirm('¿Entregar?'))return;let score=0,max=0;exam.questions.forEach(q=>{if(q.type!=='text'){max+=q.points;if(answers[q.id]!==undefined&&+answers[q.id]===q.correct)score+=q.points}});db.attempts.push({student:email,title:exam.title,score,max,events:[...events],date:new Date().toISOString()});save();home();alert('Entrega guardada solo en este navegador.')}function results(){stop();$('heading').textContent='Resultados locales';$('view').innerHTML=db.attempts.map(a=>'<div class="card">'+esc(a.student)+' · '+esc(a.title)+' · '+a.score+'/'+a.max+' · '+a.events.length+' incidencias</div>').join('')+'<button onclick="exportCSV()">Exportar CSV</button>'}function exportCSV(){let rows=[['Estudiante','Examen','Puntos','Máximo','Incidencias'],...db.attempts.map(a=>[a.student,a.title,a.score,a.max,a.events.length])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='examia-resultados.csv';a.click()}
</script></html>
